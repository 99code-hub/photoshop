name: Delete all branches except main

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm"
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/branches" --jq '.[].name' | while read -r branch; do
            if [ "$branch" = "main" ]; then
              echo "Keeping: $branch"
              continue
            fi
            echo "Deleting: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" || echo "Failed: $branch"
          done
